definitions:
  db.List:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  db.Todo:
    properties:
      complete_before:
        type: string
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      list_id:
        type: string
      parent_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  db.User:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      password_hash:
        type: string
      username:
        type: string
    type: object
  schemas.CreateList:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  schemas.CreateShare:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  schemas.CreateTodo:
    properties:
      complete_before:
        type: string
      description:
        type: string
      parent_id:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  schemas.CreateUser:
    properties:
      is_admin:
        type: boolean
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  schemas.ErrorResponse:
    properties:
      detail:
        type: string
      status:
        type: string
    type: object
  schemas.Login:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  schemas.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      status:
        type: string
    type: object
  schemas.Refresh:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  schemas.ResponseShare:
    properties:
      id:
        type: string
      list_id:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  schemas.ResponseUser:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      username:
        type: string
    type: object
  schemas.UpdateList:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  schemas.UpdatePassword:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  schemas.UpdateTodo:
    properties:
      complete_before:
        type: string
      completed:
        type: boolean
      description:
        type: string
      title:
        type: string
    type: object
  schemas.UpdateUser:
    properties:
      is_admin:
        type: boolean
      username:
        type: string
    required:
    - is_admin
    - username
    type: object
info:
  contact: {}
  description: This is a simple todo application API built with Go and Gin.
  title: Go Todo API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in a user with username and password, returning JWT tokens
        upon successful authentication.
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/schemas.Login'
      produces:
      - application/json
      responses:
        "200":
          description: Returns access and refresh tokens.
          schema:
            $ref: '#/definitions/schemas.LoginResponse'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid credentials.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user by invalidating their refresh token.
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: logout
        required: true
        schema:
          $ref: '#/definitions/schemas.Refresh'
      produces:
      - application/json
      responses:
        "204":
          description: No Content - Successfully logged out.
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid or expired token.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Logout user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes JWT access and refresh tokens using a valid refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/schemas.Refresh'
      produces:
      - application/json
      responses:
        "200":
          description: Returns new access and refresh tokens.
          schema:
            $ref: '#/definitions/schemas.LoginResponse'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid or expired token.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Refresh tokens
      tags:
      - Auth
  /auth/update-password:
    post:
      consumes:
      - application/json
      description: Updates the password for an authenticated user.
      parameters:
      - description: Old and new passwords
        in: body
        name: updatePassword
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdatePassword'
      produces:
      - application/json
      responses:
        "200":
          description: Returns new access and refresh tokens.
          schema:
            $ref: '#/definitions/schemas.LoginResponse'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid token or invalid password.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Update user password
      tags:
      - Auth
  /list:
    get:
      description: Retrieves todo lists based on the 'show' query parameter. Options
        include owned, shared, all, and admin (admin requires admin privileges).
      parameters:
      - default: all
        description: 'Filter for lists to retrieve: owned, shared, all, admin'
        in: query
        name: show
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns a list of todo lists with their associated todos.
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for non-admins when requesting admin lists.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Get todo lists
      tags:
      - Lists
    post:
      consumes:
      - application/json
      description: Creates a new todo list for the authenticated user.
      parameters:
      - description: Todo list to create
        in: body
        name: list
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateList'
      produces:
      - application/json
      responses:
        "201":
          description: Returns the created todo list.
          schema:
            $ref: '#/definitions/db.List'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new todo list
      tags:
      - Lists
  /list/{listID}:
    delete:
      description: Deletes a todo list by its ID. Only the owner or an admin can delete
        the list.
      parameters:
      - description: ID of the todo list to delete
        in: path
        name: listID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content, indicating successful deletion.
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for non-owners/non-admins.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete todo list
      tags:
      - Lists
    get:
      description: Retrieves a todo list by its ID along with all associated todo
        items. Access is restricted to users with permissions for the list.
      parameters:
      - description: ID of the todo list to retrieve
        in: path
        name: listID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns the todo list details along with its todos.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for users without access to the list.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Get todo list with todos
      tags:
      - Lists
    patch:
      consumes:
      - application/json
      description: Updates the title and/or description of a specific todo list. Requires
        ownership of the list or admin privileges.
      parameters:
      - description: ID of the todo list to update
        in: path
        name: listID
        required: true
        type: string
      - description: Updated title and/or description
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateList'
      produces:
      - application/json
      responses:
        "200":
          description: Returns the updated todo list.
          schema:
            $ref: '#/definitions/db.List'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for non-owners or non-admins.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Update a todo list
      tags:
      - Lists
  /list/{listID}/share:
    get:
      description: Retrieves all shares associated with a specific todo list. Requires
        ownership of the list or admin privileges.
      parameters:
      - description: ID of the todo list
        in: path
        name: listID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns a list of shares for the specified todo list.
          schema:
            items:
              $ref: '#/definitions/schemas.ResponseShare'
            type: array
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for non-owners or non-admins.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Get shares for a todo list
      tags:
      - Shares
    post:
      consumes:
      - application/json
      description: Shares a todo list with another user by their username.
      parameters:
      - description: ID of the todo list to share
        in: path
        name: listID
        required: true
        type: string
      - description: Share details
        in: body
        name: share
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateShare'
      produces:
      - application/json
      responses:
        "201":
          description: Returns the share ID upon successful sharing.
          schema:
            $ref: '#/definitions/schemas.ResponseShare'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list or user not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Share a todo list with another user
      tags:
      - Shares
  /list/{listID}/share/{shareID}:
    delete:
      description: Removes a share for a todo list by its ID. Only the owner, the
        shared user, or an admin can remove the share.
      parameters:
      - description: ID of the todo list to unshare
        in: path
        name: listID
        required: true
        type: string
      - description: ID of the share to remove
        in: path
        name: shareID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content, indicating successful unsharing.
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for non-owners/non-admins/non-shared-users.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list or share not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Remove list share
      tags:
      - Shares
  /list/{listID}/todo:
    post:
      consumes:
      - application/json
      description: Creates a new todo item in the specified todo list.
      parameters:
      - description: ID of the todo list
        in: path
        name: listID
        required: true
        type: string
      - description: Todo item to create
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateTodo'
      produces:
      - application/json
      responses:
        "201":
          description: Returns the created todo item.
          schema:
            $ref: '#/definitions/db.Todo'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new todo item
      tags:
      - Todos
  /list/{listID}/todo/{todoID}:
    delete:
      description: Deletes a todo item by its ID within a specified list. Only users
        with access to the list can delete the todo item.
      parameters:
      - description: ID of the todo list containing the todo item
        in: path
        name: listID
        required: true
        type: string
      - description: ID of the todo item to delete
        in: path
        name: todoID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content, indicating successful deletion.
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for users without access to the list.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo item or list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete todo item
      tags:
      - Todos
    patch:
      consumes:
      - application/json
      description: Updates the details of a specific todo item, including title, description,
        completion status, and deadline. Requires access to the associated todo list.
      parameters:
      - description: ID of the todo list containing the todo item
        in: path
        name: listID
        required: true
        type: string
      - description: ID of the todo item to update
        in: path
        name: todoID
        required: true
        type: string
      - description: Updated todo item details
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateTodo'
      produces:
      - application/json
      responses:
        "200":
          description: Returns the updated todo item.
          schema:
            $ref: '#/definitions/db.Todo'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to missing or invalid JWT.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action for users without access to the todo list.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Todo item or list not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Update a todo item
      tags:
      - Todos
  /user:
    post:
      consumes:
      - application/json
      description: Creates a new user account. The first user created is granted admin
        privileges.
      parameters:
      - description: User creation payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: Returns the created user object.
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      summary: Create user
      tags:
      - User
  /user/{id}:
    delete:
      description: Deletes a user account. Users can delete their own accounts; admins
        can delete any account.
      parameters:
      - description: ID of the user to delete
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Indicates successful deletion with no content.
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid credentials.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete user
      tags:
      - User
    put:
      consumes:
      - application/json
      description: Updates user information. Users can update their own information;
        admins can update any user's information.
      parameters:
      - description: ID of the user to update
        in: path
        name: id
        required: true
        type: string
      - description: User update payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateUser'
      produces:
      - application/json
      responses:
        "200":
          description: Returns the updated user object.
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid credentials.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: User not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Update user
      tags:
      - User
  /user/{userID}:
    get:
      consumes:
      - application/json
      description: Retrieves user information by user ID. Accessible by the user themselves
        or an admin.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns user information.
          schema:
            $ref: '#/definitions/schemas.ResponseUser'
        "400":
          description: Bad request due to invalid input.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Unauthorized due to invalid or expired token.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Forbidden action.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: User not found.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - Bearer: []
      summary: Read user information
      tags:
      - User
securityDefinitions:
  Bearer:
    description: 'Bearer token is "Bearer" followed by a space and JWT access token.
      Example: "Bearer xxxxyyyyzzzz"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
